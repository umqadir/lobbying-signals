name: Refresh Data

on:
  schedule:
    - cron: '0 10 * * *'    # daily refresh
    - cron: '0 6 3 * *'     # monthly drift audit (random sample vs live API)
    - cron: '0 6 * * 0'     # weekly coverage check (per-period DB vs API counts)
    - cron: '30 21 * * *'   # recovery slot: runs only if the last refresh failed
    - cron: '30 3 * * *'    # recovery slot
  workflow_dispatch:
    inputs:
      rules_batch_size:
        description: 'Max activities to classify with deterministic rules'
        required: false
        default: '2000000'
      full_sweep:
        description: 'Posted-after sweep over the last ~13 months (all report periods) before refreshing'
        required: false
        default: 'false'
      backfill_period:
        description: 'Re-ingest one report period in full, e.g. "2020 1"'
        required: false
        default: ''
      allow_fresh_start:
        description: 'Start an empty DB if the filings.db.zst release asset is missing'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # last refresh conclusion
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip recovery slot if the latest refresh succeeded
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$SCHEDULE" in
            '30 21 * * *'|'30 3 * * *') ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/runs?branch=main&status=completed&per_page=20" \
            -q '[.workflow_runs[].conclusion | select(. != "skipped")][0] // "none"')
          echo "Latest completed refresh: $last"
          if [ "$last" != "success" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release assets, docs/data/ commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Ensure data release exists
        run: |
          gh release view data || gh release create data --title "Data Storage" --notes "SQLite database storage for the lobbying signals dashboard"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download database from release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FRESH_START: ${{ inputs.allow_fresh_start }}
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view data --json assets -q '.assets[].name' | grep -qx 'filings.db.zst'; then
            gh release download data --pattern 'filings.db.zst' -O data/filings.prev.db.zst
            zstd -d data/filings.prev.db.zst -o data/filings.db
            count=$(python3 -c "import sqlite3; print(sqlite3.connect('data/filings.db').execute('SELECT COUNT(*) FROM filings').fetchone()[0])")
          elif [ "$ALLOW_FRESH_START" = "true" ]; then
            echo "filings.db.zst missing; fresh start allowed by input"
            count=0
          else
            echo "::error::Release asset filings.db.zst is missing. Restore it from filings.prev.db.zst or a dated backup, or rerun with allow_fresh_start."
            exit 1
          fi
          echo "Baseline filings: $count"
          echo "BASELINE_FILINGS=$count" >> "$GITHUB_ENV"

      - name: Initialize database if needed
        run: |
          if [ ! -f data/filings.db ]; then
            echo "Creating fresh database..."
            uv run python -c "from db import init_db; init_db()"
          fi

      - name: Monthly drift audit (large random sample vs live API)
        if: github.event.schedule == '0 6 3 * *'
        run: |
          uv run python 01_ingest.py audit-sample --n 40000 --max-minutes 270
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}

      - name: Deep posted-after sweep (manual)
        if: github.event.inputs.full_sweep == 'true'
        run: |
          uv run python 01_ingest.py full-sweep --start-year 2020
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}

      - name: Targeted period backfill (manual)
        if: github.event.inputs.backfill_period != ''
        run: |
          set -euo pipefail
          if [[ ! "$BACKFILL_PERIOD" =~ ^(20[0-9]{2})\ ([1-4])$ ]]; then
            echo "::error::backfill_period must be 'YYYY Q', e.g. '2020 1'"
            exit 1
          fi
          uv run python 01_ingest.py "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          BACKFILL_PERIOD: ${{ github.event.inputs.backfill_period }}

      - name: Weekly coverage check (per-period DB vs API counts)
        if: github.event.schedule == '0 6 * * 0'
        run: |
          uv run python 01_ingest.py coverage-check
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}

      - name: Run refresh
        run: |
          set -euo pipefail
          if [[ ! "$RULES_BATCH_SIZE" =~ ^[0-9]+$ ]]; then
            echo "::error::rules_batch_size must be a non-negative integer"
            exit 1
          fi
          uv run python 07_refresh.py \
            --rules-batch-size "$RULES_BATCH_SIZE" \
            --failure-marker "$RUNNER_TEMP/ingest-incomplete"
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          RULES_BATCH_SIZE: ${{ github.event.inputs.rules_batch_size || '2000000' }}

      - name: Upload database to release
        run: |
          set -euo pipefail
          count=$(python3 -c "import sqlite3; print(sqlite3.connect('data/filings.db').execute('SELECT COUNT(*) FROM filings').fetchone()[0])")
          echo "Filings: baseline $BASELINE_FILINGS, now $count"
          if [ "$count" -lt $(( BASELINE_FILINGS * 97 / 100 )) ]; then
            echo "::error::Filing count fell more than 3% ($BASELINE_FILINGS -> $count); not uploading."
            exit 1
          fi
          zstd -9 -T0 -f data/filings.db -o data/filings.db.zst
          if [ -f data/filings.prev.db.zst ]; then
            # Backups: previous run's DB, plus one dated copy per month (newest 3 kept).
            gh release upload data data/filings.prev.db.zst --clobber
            assets=$(gh release view data --json assets -q '.assets[].name')
            month="filings.$(date -u +%Y-%m).db.zst"
            if ! grep -qx "$month" <<<"$assets"; then
              ln data/filings.prev.db.zst "data/$month"
              gh release upload data "data/$month"
              { grep -E '^filings\.[0-9]{4}-[0-9]{2}\.db\.zst$' <<<"$assets" || true; } | sort | head -n -2 \
                | while read -r old; do gh release delete-asset data "$old" -y; done
            fi
          fi
          gh release upload data data/filings.db.zst --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit JSON exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Update data exports [skip ci]"
          # Rebase over commits that landed during the run; on conflicts keep
          # this run's docs/data/ exports, abort on anything else.
          exports_commit=$(git rev-parse HEAD)
          if ! git pull --rebase origin main; then
            while :; do
              conflicts=()
              while IFS= read -r -d '' path; do
                conflicts+=("$path")
              done < <(git diff --name-only --diff-filter=U -z)
              if [ ${#conflicts[@]} -eq 0 ]; then
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "$path" in
                  docs/data/*)
                    if git cat-file -e "$exports_commit:$path" 2>/dev/null; then
                      git restore --source="$exports_commit" --staged --worktree -- "$path"
                    else
                      git rm -- "$path"
                    fi
                    ;;
                  *)
                    echo "Rebase conflict outside generated exports: $path"
                    git rebase --abort
                    exit 1
                    ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue && break
            done
          fi
          git push

      - name: Fail if ingestion was incomplete
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ingest-incomplete" ]; then
            echo "::error::$(cat "$RUNNER_TEMP/ingest-incomplete")"
            exit 1
          fi
